<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Business Card</title>

    <!-- Google Font Links -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <!-- Stylesheet Link  -->
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="card-container">
      <header>
        <h1 id="owner">Robert Kamau</h1>
        <h2>Full Stack Software Developer</h2>
        <hr />
      </header>
      <main>
        <section>
          <form action="#" method="POST">
            <label for="fName">First Name:</label><br />
            <input
              type="text"
              name="fName"
              id="fName"
              placeholder="John"
            /><br />

            <label for="lName">Last Name:</label><br />
            <input
              type="text"
              name="lName"
              id="lName"
              placeholder="Kariuki"
            /><br />

            <label for="email">Your Email:</label><br />
            <input
              type="email"
              name="email"
              id="email"
              placeholder="johnkariuki@gmail.com"
            />
            <br />

            <label for="comments"
              >Any thoughts you would like to share with me:
            </label>
            <br />
            <textarea
              name="comments"
              id="comments"
              placeholder="Type in any remarks here ... "
            ></textarea>
            <br />

            <button type="submit">Submit</button> <br />
          </form>
          <div class="contact-info">
            <p>My Contact Info:</p>
            <a href="mailto:robertkamau.sw@gmail.com">Send Email</a>
            <a href="tel:+257123456789">Call Me</a>
            <address>
              HackHouse Africa<br />
              123 East Manyani Road<br />
              Nairobi, Kenya<br />
            </address>
          </div>
        </section>
      </main>
      <footer>
        <nav>
          <ul>
            <li>
              <a href="https://github.com/GeoKoder" target="_blank">GitHub</a>
            </li>
            <li>
              <a href="https://ke.linkedin.com/" target="_blank">Linkedn</a>
            </li>
            <li>
              <a href="https://x.com/OrbGee69048" target="_blank">Twitter</a>
            </li>
          </ul>
        </nav>
      </footer>
    </div>
  </body>
</html>
